name: Playwright Tests

on:
  push:
    branches:
      - main
      - master
      - 'feat/**'
  pull_request:
    branches:
      - main
      - master

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer
          coverage: none

      - name: Validate Composer dependencies
        run: composer validate --no-check-publish

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: npm

      - name: Install Node.js dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Prepare Laravel environment
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan config:clear
          php artisan route:clear
          php artisan view:clear

      - name: Check Laravel login endpoint
        run: |
          php artisan serve --host=127.0.0.1 --port=8000 > /tmp/laravel-server.log 2>&1 &
          echo $! > /tmp/laravel-server.pid

          for i in $(seq 1 30); do
            if curl --silent --show-error --fail \
              http://127.0.0.1:8000/login \
              --output /tmp/login-response.html; then
              echo "Login endpoint is responding."
              exit 0
            fi

            if ! kill -0 "$(cat /tmp/laravel-server.pid)" 2>/dev/null; then
              echo "Laravel server stopped unexpectedly."
              cat /tmp/laravel-server.log
              exit 1
            fi

            sleep 2
          done

          echo "Laravel login endpoint did not become ready."
          cat /tmp/laravel-server.log
          exit 1

      - name: Run Playwright tests
        run: npx playwright test
        env:
          CI: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
          if-no-files-found: ignore
