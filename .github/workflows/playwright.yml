name: Playwright Tests

on:
  push:
    branches:
      - main
      - master
      - 'feat/**'
  pull_request:
    branches:
      - main
      - master

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer
          coverage: none

      - name: Validate Composer dependencies
        run: composer validate --no-check-publish

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: npm

      - name: Install Node.js dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Prepare Laravel environment
        run: |
          cp .env.example .env
          mkdir -p database
          touch database/database.sqlite

          php artisan key:generate

          echo "DB_CONNECTION=sqlite" >> .env
          echo "DB_DATABASE=${GITHUB_WORKSPACE}/database/database.sqlite" >> .env

          echo "SESSION_DRIVER=file" >> .env
          echo "CACHE_STORE=file" >> .env
          echo "CACHE_DRIVER=file" >> .env
          echo "QUEUE_CONNECTION=sync" >> .env

          php artisan config:clear
          php artisan route:clear
          php artisan view:clear

      - name: Run database migrations
        run: php artisan migrate --force

      - name: Check Laravel login endpoint
        run: |
          set -eu

          php artisan serve --host=127.0.0.1 --port=8000 \
            > /tmp/laravel-server.log 2>&1 &
          echo $! > /tmp/laravel-server.pid

          for i in $(seq 1 30); do
            status=$(curl --silent --output /tmp/login-response.html \
              --write-out "%{http_code}" \
              http://127.0.0.1:8000/login || true)

            if [ "$status" = "200" ]; then
              echo "Laravel login endpoint is responding."
              exit 0
            fi

            if [ "$status" = "500" ]; then
              echo "Laravel returned HTTP 500."
              break
            fi

            if ! kill -0 "$(cat /tmp/laravel-server.pid)" 2>/dev/null; then
              echo "Laravel server stopped unexpectedly."
              break
            fi

            sleep 2
          done

          echo "Login endpoint check failed."
          echo "----- Laravel server log -----"
          cat /tmp/laravel-server.log || true
          echo "----- Laravel application log -----"
          if [ -f storage/logs/laravel.log ]; then
            tail -n 100 storage/logs/laravel.log
          else
            echo "storage/logs/laravel.log was not created."
          fi
          exit 1

      - name: Run Playwright tests
        run: npx playwright test
        env:
          CI: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
          if-no-files-found: ignore